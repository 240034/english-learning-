<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice — English Journey</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #eaeaea;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 24px;
            padding-left: 12px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #4a5568;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background-color: #f7fafc;
        }
        .nav-item.active {
            background-color: #fff7ed;
            color: #ea580c;
            font-weight: 600;
        }
        .main-content {
            flex: 1;
            padding: 40px;
            background-color: #f8f9fa;
        }
        .part-selector-container {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .part-selector-container select {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: white;
            outline: none;
            cursor: pointer;
        }
        .practice-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }
        .exercise-type {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #ea580c;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: block;
        }
        .sentence-box {
            font-size: 1.3rem;
            color: #1e293b;
            margin: 20px 0 16px 0;
            line-height: 1.6;
            font-weight: 500;
        }
        .hint-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .hint-badge {
            font-size: 0.9rem;
            color: #c2410c;
            background-color: #ffedd5;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .input-box {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        .input-box:focus {
            border-color: #ea580c;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .option-btn {
            padding: 14px 16px;
            font-size: 1rem;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #334155;
            text-align: center;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }
        .option-btn.correct, .input-correct {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }
        .option-btn.wrong, .input-wrong {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
        .submit-btn, #next-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background-color: #ea580c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:hover, #next-btn:hover {
            background-color: #c2410c;
        }
        #next-btn {
            display: none;
        }
        .feedback-message {
            margin-top: 12px;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">English Journey</div>
            <a href="./index.html" class="nav-item">🏠 Home</a>
            <a href="./learn.html" class="nav-item">📚 Learn</a>
            <a href="./daily-tests.html" class="nav-item">📝 Daily Tests</a>
            <a href="./weekly-quiz.html" class="nav-item">🧠 Weekly Quiz</a>
            <a href="./practice.html" class="nav-item active">✏️ Practice</a>
            <a href="./hard-level.html" class="nav-item">🔥 Hard Level</a>
            <a href="./beyond-words.html" class="nav-item">🌐 Beyond Words</a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <h1 style="font-size: 2.2rem; color: #2c3e50;">4. ✏️ Practice — Практика контекста</h1>
                <p style="color: #64748b;">Закрепляйте слова прямо в предложениях</p>
            </header>

            <div class="part-selector-container">
                <label for="part-select" style="font-weight: 600; color: #334155;">Выберите часть:</label>
                <select id="part-select">
                    <option value="1">Part 1 (Fill in the Blank)</option>
                    <option value="2">Part 2 (Multiple Choice)</option>
                </select>
            </div>

            <div class="practice-card">
                <span id="exercise-tracker" style="color: #64748b; font-size: 0.9rem;">Упражнение 1</span>
                <span id="exercise-type" class="exercise-type">--</span>

                <div id="exercise-content"></div>
                <div id="feedback" class="feedback-message"></div>

                <button id="next-btn">Следующее упражнение</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { dailyWords } from './js/words-data.js';

        document.addEventListener('DOMContentLoaded', () => {
            let allWords = [];
            if (dailyWords) {
                Object.values(dailyWords).forEach(dayArray => {
                    if (Array.isArray(dayArray)) {
                        allWords.push(...dayArray);
                    }
                });
            }

            let currentExercises = [];
            let currentIndex = 0;

            const partSelect = document.getElementById('part-select');
            const tracker = document.getElementById('exercise-tracker');
            const typeLabel = document.getElementById('exercise-type');
            const contentBox = document.getElementById('exercise-content');
            const feedbackBox = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            function cleanText(text) {
                if (!text) return "";
                return text
                    .toLowerCase()
                    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            // Набор естественных шаблонов предложений
            const contextTemplates = [
                "It is important to remember the word ________ in everyday conversation.",
                "She told me that ________ is very essential for us.",
                "Can you explain what ________ means in this context?",
                "We need to focus on ________ when we practice English.",
                "I always try to use ________ whenever I speak.",
                "They discussed the concept of ________ during the lesson."
            ];

            function getSentenceForWord(item, index) {
                const targetWord = item.word || item.english || item.title || "";
                const rawExample = item.example || item.sentence || item.context || "";

                if (rawExample) {
                    const escaped = targetWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`\\b${escaped}\\b`, 'gi');
                    if (regex.test(rawExample)) {
                        return rawExample.replace(regex, '________');
                    }
                    if (rawExample.includes('________') || rawExample.includes('_____')) {
                        return rawExample;
                    }
                }

                // Используем динамический шаблон
                const template = contextTemplates[index % contextTemplates.length];
                return template;
            }

            function loadPartExercises(partNum) {
                if (allWords.length === 0) return [];

                return allWords.map((item, index) => {
                    const wordStr = item.word || item.english || item.title || "";
                    const transStr = item.translation || item.russian || item.meaning || "";
                    const sentence = getSentenceForWord(item, index);

                    return {
                        part: partNum,
                        word: wordStr,
                        translation: transStr,
                        sentence: sentence
                    };
                });
            }

            function loadPart(partNum) {
                currentExercises = loadPartExercises(partNum);
                currentIndex = 0;
                renderExercise();
            }

            function renderExercise() {
                nextBtn.style.display = 'none';
                feedbackBox.textContent = '';
                contentBox.innerHTML = '';

                if (currentExercises.length === 0) {
                    contentBox.innerHTML = "<p>Слова не найдены в js/words-data.js</p>";
                    return;
                }

                if (currentIndex >= currentExercises.length) {
                    contentBox.innerHTML = "<h2 style='color: #22c55e;'>Часть завершена! 🎉</h2>";
                    tracker.textContent = "";
                    typeLabel.textContent = "РЕЗУЛЬТАТ";
                    return;
                }

                const current = currentExercises[currentIndex];
                const selectedPart = parseInt(partSelect.value);

                tracker.textContent = `Упражнение ${currentIndex + 1} из ${currentExercises.length}`;

                // PART 1: FILL IN THE BLANK
                if (selectedPart === 1) {
                    typeLabel.textContent = "EX 1: FILL IN THE BLANK";
                    const firstLetter = current.word ? current.word.charAt(0).toLowerCase() : '';

                    contentBox.innerHTML = `
                        <div class="sentence-box">${current.sentence}</div>
                        <div class="hint-container">
                            <span class="hint-badge">💡 Перевод: "${current.translation}"</span>
                            <span class="hint-badge">🔤 Первая буква: [ ${firstLetter}... ]</span>
                        </div>
                        <input type="text" id="fill-input" class="input-box" placeholder="Напишите слово..." autocomplete="off">
                        <button id="check-fill-btn" class="submit-btn">Проверить</button>
                    `;

                    const inputEl = document.getElementById('fill-input');
                    const checkBtn = document.getElementById('check-fill-btn');

                    checkBtn.addEventListener('click', () => {
                        const userVal = cleanText(inputEl.value);
                        const correctVal = cleanText(current.word);

                        if (userVal === correctVal) {
                            inputEl.classList.add('input-correct');
                            feedbackBox.style.color = '#15803d';
                            feedbackBox.textContent = '✓ Верно!';
                        } else {
                            inputEl.classList.add('input-wrong');
                            feedbackBox.style.color = '#b91c1c';
                            feedbackBox.textContent = `✗ Неверно. Правильный ответ: ${current.word}`;
                        }
                        checkBtn.disabled = true;
                        inputEl.disabled = true;
                        nextBtn.style.display = 'block';
                    });
                }

                // PART 2: CHOOSE THE BEST WORD
                else if (selectedPart === 2) {
                    typeLabel.textContent = "EX 2: CHOOSE THE BEST WORD";

                    contentBox.innerHTML = `
                        <div class="sentence-box">${current.sentence}</div>
                        <div class="hint-container">
                            <span class="hint-badge">💡 Перевод: "${current.translation}"</span>
                        </div>
                        <div id="options-grid" class="options-grid"></div>
                    `;

                    const grid = document.getElementById('options-grid');
                    const options = generateOptions(current.word);

                    options.forEach(optWord => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.textContent = optWord;
                        btn.addEventListener('click', () => {
                            const allBtns = grid.querySelectorAll('.option-btn');
                            allBtns.forEach(b => b.disabled = true);

                            if (cleanText(optWord) === cleanText(current.word)) {
                                btn.classList.add('correct');
                                feedbackBox.style.color = '#15803d';
                                feedbackBox.textContent = '✓ Верно!';
                            } else {
                                btn.classList.add('wrong');
                                feedbackBox.style.color = '#b91c1c';
                                feedbackBox.textContent = `✗ Неверно. Правильный ответ: ${current.word}`;
                                
                                allBtns.forEach(b => {
                                    if (cleanText(b.textContent) === cleanText(current.word)) {
                                        b.classList.add('correct');
                                    }
                                });
                            }
                            nextBtn.style.display = 'block';
                        });
                        grid.appendChild(btn);
                    });
                }
            }

            function generateOptions(correctWord) {
                const opts = [correctWord];
                while (opts.length < 4 && opts.length < allWords.length) {
                    const randIndex = Math.floor(Math.random() * allWords.length);
                    const randWord = allWords[randIndex].word || allWords[randIndex].english || allWords[randIndex].title;
                    if (randWord && !opts.some(o => cleanText(o) === cleanText(randWord))) {
                        opts.push(randWord);
                    }
                }
                return opts.sort(() => Math.random() - 0.5);
            }

            partSelect.addEventListener('change', (e) => {
                loadPart(parseInt(e.target.value));
            });

            nextBtn.addEventListener('click', () => {
                currentIndex++;
                renderExercise();
            });

            loadPart(1);
        });
    </script>
</body>
</html>
