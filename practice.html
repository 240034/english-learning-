<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice — English Journey</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #eaeaea;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 24px;
            padding-left: 12px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #4a5568;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background-color: #f7fafc;
        }
        .nav-item.active {
            background-color: #fff7ed;
            color: #ea580c;
            font-weight: 600;
        }
        .main-content {
            flex: 1;
            padding: 40px;
            background-color: #f8f9fa;
        }
        .part-selector-container {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .part-selector-container select {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: white;
            outline: none;
            cursor: pointer;
        }
        .practice-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }
        .exercise-type {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #ea580c;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: block;
        }
        .sentence-box {
            font-size: 1.25rem;
            color: #1e293b;
            margin: 20px 0;
            line-height: 1.6;
        }
        .input-box {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            margin-top: 12px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        .input-box:focus {
            border-color: #ea580c;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .option-btn {
            padding: 14px 16px;
            font-size: 1rem;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #334155;
            text-align: center;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }
        .option-btn.correct, .input-correct {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }
        .option-btn.wrong, .input-wrong {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
        .words-badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .word-badge {
            background-color: #ffedd5;
            color: #c2410c;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .submit-btn, #next-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background-color: #ea580c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:hover, #next-btn:hover {
            background-color: #c2410c;
        }
        #next-btn {
            display: none;
        }
        .feedback-message {
            margin-top: 12px;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">English Journey</div>
            <a href="./index.html" class="nav-item">🏠 Home</a>
            <a href="./learn.html" class="nav-item">📚 Learn</a>
            <a href="./daily-tests.html" class="nav-item">📝 Daily Tests</a>
            <a href="./weekly-quiz.html" class="nav-item">🧠 Weekly Quiz</a>
            <a href="./practice.html" class="nav-item active">✏️ Practice</a>
            <a href="./hard-level.html" class="nav-item">🔥 Hard Level</a>
            <a href="./beyond-words.html" class="nav-item">🌐 Beyond Words</a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <h1 style="font-size: 2.2rem; color: #2c3e50;">4. ✏️ Practice — Практика контекста</h1>
                <p style="color: #64748b;">Закрепляйте слова прямо в предложениях</p>
            </header>

            <div class="part-selector-container">
                <label for="part-select" style="font-weight: 600; color: #334155;">Выберите часть:</label>
                <select id="part-select">
                    <option value="1">Part 1</option>
                    <option value="2">Part 2</option>
                    <option value="3">Part 3</option>
                </select>
            </div>

            <div class="practice-card">
                <span id="exercise-tracker" style="color: #64748b; font-size: 0.9rem;">Упражнение 1</span>
                <span id="exercise-type" class="exercise-type">--</span>

                <div id="exercise-content"></div>
                <div id="feedback" class="feedback-message"></div>

                <button id="next-btn">Следующее упражнение</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { dailyWords } from './js/words-data.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Собираем все слова в один массив
            let allWords = [];
            if (dailyWords) {
                Object.values(dailyWords).forEach(dayArray => {
                    if (Array.isArray(dayArray)) {
                        allWords.push(...dayArray);
                    }
                });
            }

            let currentPartExercises = [];
            let currentIndex = 0;

            const partSelect = document.getElementById('part-select');
            const tracker = document.getElementById('exercise-tracker');
            const typeLabel = document.getElementById('exercise-type');
            const contentBox = document.getElementById('exercise-content');
            const feedbackBox = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            // Нормализация текста: убирает всю пунктуацию и делает lowercase
            function cleanText(text) {
                return text
                    .toLowerCase()
                    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            // Нарезка всех слов на 3 равных Part и генерация 3 типов упражнений
            function generateExercisesForPart(partNum) {
                if (allWords.length === 0) return [];

                const total = allWords.length;
                const partSize = Math.ceil(total / 3);
                const startIndex = (partNum - 1) * partSize;
                const endIndex = Math.min(startIndex + partSize, total);
                const partWords = allWords.slice(startIndex, endIndex);

                const exercises = [];

                // Цикл создает 3 вида упражнений для слов текущей части
                for (let i = 0; i < partWords.length; i++) {
                    const item = partWords[i];
                    const wordStr = item.word || item.english || "";
                    const transStr = item.translation || item.russian || "";
                    const exampleSentence = item.example || `I need to use the word _____ in this sentence.`;

                    // Экс 1: Fill in the blank (Ввод вручную)
                    exercises.push({
                        type: "Ex 1: Fill in the blank",
                        kind: "fill",
                        word: wordStr,
                        translation: transStr,
                        sentence: exampleSentence
                    });

                    // Экс 2: Выбор наилучшего подходящего слова
                    exercises.push({
                        type: "Ex 2: Choose the best word",
                        kind: "choice",
                        word: wordStr,
                        translation: transStr,
                        sentence: exampleSentence
                    });

                    // Экс 3: Составление предложения (минимум 2 слова из списка)
                    if (i % 2 === 0) {
                        const word2Item = partWords[(i + 1) % partWords.length];
                        const word2Str = word2Item.word || word2Item.english || "";
                        exercises.push({
                            type: "Ex 3: Create a sentence",
                            kind: "create",
                            requiredWords: [wordStr, word2Str],
                            translation: `Составьте предложение, используя оба слова: ${wordStr} и ${word2Str}`
                        });
                    }
                }

                return exercises;
            }

            function loadPart(partNum) {
                currentPartExercises = generateExercisesForPart(partNum);
                currentIndex = 0;
                renderExercise();
            }

            function renderExercise() {
                nextBtn.style.display = 'none';
                feedbackBox.textContent = '';
                contentBox.innerHTML = '';

                if (currentPartExercises.length === 0) {
                    contentBox.innerHTML = "<p>Слова не найдены в words-data.js</p>";
                    return;
                }

                if (currentIndex >= currentPartExercises.length) {
                    contentBox.innerHTML = "<h2 style='color: #22c55e;'>Часть завершена! 🎉</h2>";
                    tracker.textContent = "";
                    typeLabel.textContent = "РЕЗУЛЬТАТ";
                    return;
                }

                const current = currentPartExercises[currentIndex];
                tracker.textContent = `Упражнение ${currentIndex + 1} из ${currentPartExercises.length}`;
                typeLabel.textContent = current.type;

                // Отрисовка Экс 1: Fill in the blank (ручной ввод)
                if (current.kind === 'fill') {
                    const sentenceWithBlank = current.sentence.includes('_____') 
                        ? current.sentence.replace('_____', '_______') 
                        : `_____ (${current.translation})`;

                    contentBox.innerHTML = `
                        <div class="sentence-box">${sentenceWithBlank}</div>
                        <p style="color: #64748b; font-size: 0.95rem;">Введите пропущенное слово на английском:</p>
                        <input type="text" id="fill-input" class="input-box" placeholder="Напишите слово..." autocomplete="off">
                        <button id="check-fill-btn" class="submit-btn">Проверить</button>
                    `;

                    document.getElementById('check-fill-btn').addEventListener('click', () => {
                        const inputEl = document.getElementById('fill-input');
                        const userVal = cleanText(inputEl.value);
                        const correctVal = cleanText(current.word);

                        if (userVal === correctVal) {
                            inputEl.classList.add('input-correct');
                            feedbackBox.style.color = '#15803d';
                            feedbackBox.textContent = '✓ Верно!';
                        } else {
                            inputEl.classList.add('input-wrong');
                            feedbackBox.style.color = '#b91c1c';
                            feedbackBox.textContent = `✗ Неверно. Правильный ответ: ${current.word}`;
                        }
                        document.getElementById('check-fill-btn').disabled = true;
                        nextBtn.style.display = 'block';
                    });
                }

                // Отрисовка Экс 2: Выбор слова из списка
                else if (current.kind === 'choice') {
                    const sentenceWithBlank = current.sentence.includes('_____') 
                        ? current.sentence.replace('_____', '_______') 
                        : `_____ (${current.translation})`;

                    contentBox.innerHTML = `
                        <div class="sentence-box">${sentenceWithBlank}</div>
                        <div id="options-grid" class="options-grid"></div>
                    `;

                    const grid = document.getElementById('options-grid');
                    const options = generateOptions(current.word);

                    options.forEach(optWord => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.textContent = optWord;
                        btn.addEventListener('click', () => {
                            const allBtns = grid.querySelectorAll('.option-btn');
                            allBtns.forEach(b => b.disabled = true);

                            if (cleanText(optWord) === cleanText(current.word)) {
                                btn.classList.add('correct');
                                feedbackBox.style.color = '#15803d';
                                feedbackBox.textContent = '✓ Отлично!';
                            } else {
                                btn.classList.add('wrong');
                                feedbackBox.style.color = '#b91c1c';
                                feedbackBox.textContent = `✗ Правильный ответ: ${current.word}`;
                            }
                            nextBtn.style.display = 'block';
                        });
                        grid.appendChild(btn);
                    });
                }

                // Отрисовка Экс 3: Составление предложения с минимум 2 словами
                else if (current.kind === 'create') {
                    const badges = current.requiredWords
                        .map(w => `<span class="word-badge">${w}</span>`)
                        .join('');

                    contentBox.innerHTML = `
                        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 8px;">Используйте оба этих слова в своем предложении:</p>
                        <div class="words-badge-container">${badges}</div>
                        <textarea id="create-textarea" class="input-box" rows="3" placeholder="Напишите предложение здесь..."></textarea>
                        <button id="check-create-btn" class="submit-btn">Проверить предложение</button>
                    `;

                    document.getElementById('check-create-btn').addEventListener('click', () => {
                        const areaEl = document.getElementById('create-textarea');
                        const userText = cleanText(areaEl.value);

                        // Проверяем наличие обоих слов без учета регистра и знаков
                        const missingWords = current.requiredWords.filter(w => !userText.includes(cleanText(w)));

                        if (missingWords.length === 0) {
                            areaEl.classList.add('input-correct');
                            feedbackBox.style.color = '#15803d';
                            feedbackBox.textContent = '✓ Супер! Оба слова использованы верно.';
                        } else {
                            areaEl.classList.add('input-wrong');
                            feedbackBox.style.color = '#b91c1c';
                            feedbackBox.textContent = `✗ Не хватает следующих слов в предложении: ${missingWords.join(', ')}`;
                        }
                        document.getElementById('check-create-btn').disabled = true;
                        nextBtn.style.display = 'block';
                    });
                }
            }

            function generateOptions(correctWord) {
                const opts = [correctWord];
                while (opts.length < 4 && opts.length < allWords.length) {
                    const randIndex = Math.floor(Math.random() * allWords.length);
                    const randWord = allWords[randIndex].word || allWords[randIndex].english;
                    if (randWord && !opts.some(o => cleanText(o) === cleanText(randWord))) {
                        opts.push(randWord);
                    }
                }
                return opts.sort(() => Math.random() - 0.5);
            }

            partSelect.addEventListener('change', (e) => {
                loadPart(parseInt(e.target.value));
            });

            nextBtn.addEventListener('click', () => {
                currentIndex++;
                renderExercise();
            });

            loadPart(1);
        });
    </script>
</body>
</html>
