<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn — Изучение слов</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка для мобильных устройств -->
    <div class="mobile-header">
        <span style="font-weight: bold; font-size: 1.2rem; color: var(--primary-color);">English Journey</span>
        <button class="mobile-toggle" onclick="toggleMobileSidebar()">☰</button>
    </div>

    <!-- Боковое меню (Sidebar) -->
    <aside id="sidebar">
        <button class="toggle-btn" id="sidebar-toggle" onclick="toggleDesktopSidebar()">◀</button>
        <div class="logo">English Journey</div>
        <ul class="nav-links">
            <li><a href="index.html"><span class="icon">🏠</span><span class="text">Home</span></a></li>
            <li class="active"><a href="learn.html"><span class="icon">📚</span><span class="text">Learn</span></a></li>
            <li><a href="daily-tests.html"><span class="icon">📝</span><span class="text">Daily Tests</span></a></li>
            <li><a href="weekly-quiz.html"><span class="icon">🧠</span><span class="text">Weekly Quiz</span></a></li>
            <li><a href="practice.html"><span class="icon">✏️</span><span class="text">Practice</span></a></li>
            <li><a href="hard-level.html"><span class="icon">🔥</span><span class="text">Hard Level</span></a></li>
            <li><a href="beyond-words.html"><span class="icon">🌎</span><span class="text">Beyond Words</span></a></li>
        </ul>
    </aside>

    <!-- Основной контент -->
    <main>
        <h1 class="page-title">1. 📚 Learn — Изучение слов</h1>
        <p class="page-subtitle">Выберите день или категорию глаголов. Нажмите на карточку, чтобы перевернуть её.</p>

        <!-- Главные табы (День 1, День 2, Irregular Verbs) -->
        <div class="date-tabs" id="main-tabs"></div>

        <!-- Под-табы для групп Irregular Verbs -->
        <div class="date-tabs" id="sub-tabs" style="margin-top: 10px; display: none;"></div>

        <!-- Сетка флеш-карточек со словами -->
        <div class="cards-grid" id="cards-grid"></div>
    </main>

    <script src="js/sidebar.js"></script>

    <script type="module">
        import { dailyWords, irregularVerbGroups } from './js/words-data.js';

        let mainCategory = 'daily'; 
        let currentDay = Object.keys(dailyWords)[0]; 
        let currentGroupKey = Object.keys(irregularVerbGroups)[0];

        const mainTabsContainer = document.getElementById('main-tabs');
        const subTabsContainer = document.getElementById('sub-tabs');
        const cardsGrid = document.getElementById('cards-grid');

        function renderTabs() {
            mainTabsContainer.innerHTML = '';
            subTabsContainer.innerHTML = '';

            // 1. Дни
            Object.keys(dailyWords).forEach(dayKey => {
                const count = dailyWords[dayKey].length;
                const tab = document.createElement('div');
                tab.className = `date-tab ${mainCategory === 'daily' && currentDay === dayKey ? 'active' : ''}`;
                tab.onclick = () => {
                    mainCategory = 'daily';
                    currentDay = dayKey;
                    renderTabs();
                    renderCards();
                };
                tab.innerHTML = `
                    <div class="tab-info">
                        <span class="tab-date">День ${dayKey}</span>
                        <span class="tab-count">${count} words</span>
                    </div>
                `;
                mainTabsContainer.appendChild(tab);
            });

            // Кнопка Irregular Verbs
            const irregularTab = document.createElement('div');
            irregularTab.className = `date-tab ${mainCategory === 'irregular' ? 'active' : ''}`;
            irregularTab.onclick = () => {
                mainCategory = 'irregular';
                renderTabs();
                renderCards();
            };
            irregularTab.innerHTML = `
                <div class="tab-info">
                    <span class="tab-date">Irregular Verbs</span>
                    <span class="tab-count">Группы</span>
                </div>
            `;
            mainTabsContainer.appendChild(irregularTab);

            // 2. Группы глаголов
            if (mainCategory === 'irregular') {
                subTabsContainer.style.display = 'flex';

                Object.keys(irregularVerbGroups).forEach(groupKey => {
                    const group = irregularVerbGroups[groupKey];
                    const count = group.words.length;

                    const subTab = document.createElement('div');
                    subTab.className = `date-tab ${currentGroupKey === groupKey ? 'active' : ''}`;
                    subTab.onclick = () => {
                        currentGroupKey = groupKey;
                        renderTabs();
                        renderCards();
                    };
                    subTab.innerHTML = `
                        <div class="tab-info">
                            <span class="tab-date">${group.title}</span>
                            <span class="tab-count">${count} words</span>
                        </div>
                    `;
                    subTabsContainer.appendChild(subTab);
                });
            } else {
                subTabsContainer.style.display = 'none';
            }
        }

        function renderCards() {
            cardsGrid.innerHTML = '';
            let wordsToRender = [];

            if (mainCategory === 'daily') {
                wordsToRender = (dailyWords[currentDay] || []).map(item => ({
                    ...item,
                    isIrregular: false
                }));
            } else {
                const group = irregularVerbGroups[currentGroupKey];
                if (group && group.words) {
                    wordsToRender = group.words.map(item => ({
                        word: item.word,
                        translation: item.translation,
                        image: item.image,
                        audio: item.audio,
                        forms: item.forms,
                        formTranslations: item.formTranslations || {
                            v1: item.translation,
                            v2: "согнул", // здесь можно будет указать свои переводы в words-data.js
                            v3: "согнутый"
                        },
                        isIrregular: true
                    }));
                }
            }

            wordsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = 'flashcard';
                card.onclick = () => card.classList.toggle('flipped');

                let frontContent = '';
                let backContent = '';

                if (item.isIrregular && item.forms) {
                    // Лицевая сторона (три формы в ряд)
                    frontContent = `
                        <div class="card-image-wrapper">
                            <img src="${item.image}" alt="${item.word}" loading="lazy">
                        </div>
                        <h3>${item.forms.v1} — ${item.forms.v2} — ${item.forms.v3}</h3>
                        <button class="audio-btn" onclick="event.stopPropagation(); playIrregularAudio('${item.forms.v1}', '${item.forms.v2}', '${item.forms.v3}', '${item.audio}')">🔊</button>
                        <span class="hint-text">Кликните, чтобы перевернуть</span>
                    `;
                    
                    // Обратная сторона: главный фиолетовый перевод сверху + детальные формы с переводами снизу
                    backContent = `
                        <h3 style="margin-bottom: 15px;">${item.translation}</h3>
                        <div style="text-align: left; display: inline-block; font-size: 0.95rem; color: #555; line-height: 1.6;">
                            <div><b>V1:</b> ${item.forms.v1} — ${item.formTranslations.v1}</div>
                            <div><b>V2:</b> ${item.forms.v2} — ${item.formTranslations.v2}</div>
                            <div><b>V3:</b> ${item.forms.v3} — ${item.formTranslations.v3}</div>
                        </div>
                    `;
                } else {
                    // Обычная карточка (для дней)
                    frontContent = `
                        <div class="card-image-wrapper">
                            <img src="${item.image}" alt="${item.word}" loading="lazy">
                        </div>
                        <h3>${item.word}</h3>
                        <button class="audio-btn" onclick="event.stopPropagation(); playAudio('${item.audio}')">🔊</button>
                        <span class="hint-text">Кликните, чтобы перевернуть</span>
                    `;
                    backContent = `<h3>${item.translation}</h3>`;
                }

                card.innerHTML = `
                    <div class="flashcard-inner">
                        <div class="flashcard-front">${frontContent}</div>
                        <div class="flashcard-back">${backContent}</div>
                    </div>
                `;
                cardsGrid.appendChild(card);
            });
        }

        // Обычная озвучка
        window.playAudio = function(src) {
            if (!src) return;
            const audio = new Audio(src);
            audio.play().catch(e => console.log("Ошибка воспроизведения звука:", e));
        };

        // Озвучка трех форм с интервалом в 1 секунду
        window.playIrregularAudio = function(v1, v2, v3, fallbackAudio) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const utter1 = new SpeechSynthesisUtterance(v1);
                utter1.lang = 'en-US';
                const utter2 = new SpeechSynthesisUtterance(v2);
                utter2.lang = 'en-US';
                const utter3 = new SpeechSynthesisUtterance(v3);
                utter3.lang = 'en-US';

                window.speechSynthesis.speak(utter1);

                setTimeout(() => {
                    window.speechSynthesis.speak(utter2);
                }, 1000);

                setTimeout(() => {
                    window.speechSynthesis.speak(utter3);
                }, 2000);
            } else if (fallbackAudio) {
                playAudio(fallbackAudio);
            }
        };

        renderTabs();
        renderCards();
    </script>
</body>
</html>
